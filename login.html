<!DOCTYPE html>
<html lang="en">
<head>
    <script src="capacitor.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login - PayTrack</title>
    <link rel="icon" type="image/png" href="Paytrack-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="net-status.js"></script>
    <script src="sw-register.js"></script>
    <script src="app-promo.js"></script>
    <script src="share-intent.js"></script>
</head>
<body class="p-4 bg-gray-900 min-h-screen flex items-center justify-center font-[Inter]">

    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-500 to-teal-600"></div>

        <div class="text-center mb-8 mt-2">
            <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 mt-1">Login to sync your data</p>
        </div>

        <div id="successMsg" class="hidden bg-green-100 border-l-4 border-green-500 text-green-700 p-3 rounded mb-6 text-sm">
            <p class="font-bold">Account Created!</p>
            <p>Please login with your new credentials.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <!-- Username & PIN Inputs (Same as before) -->
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-user"></i></span>
                    <input type="text" id="loginUsername" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Your username">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">PIN</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-lock"></i></span>
                    <input type="password" id="loginPin" maxlength="4" inputmode="numeric" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 text-center text-xl tracking-widest font-mono" placeholder="••••">
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-700 hover:to-teal-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transform transition active:scale-95 flex justify-center items-center">
                <span id="loginBtnText">Login & Sync</span>
                <i id="loginSpinner" class="fas fa-spinner fa-spin hidden"></i>
            </button>
        </form>

        <div id="loginError" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm border border-red-200 flex items-start">
            <i class="fas fa-times-circle mt-1 mr-2"></i>
            <span id="loginErrorText"></span>
        </div>

        <div class="text-center mt-6 pt-4 border-t border-gray-100">
            <a href="register.html" class="text-green-600 font-semibold hover:underline text-sm">Create an account</a>
            <br>
            <a href="dashboard.html" class="text-gray-400 text-xs hover:text-gray-600 mt-4 inline-block">Continue Offline</a>
        </div>
    </div>

    <script>
    // auth.js (and the Firebase SDK it pulls from Google's CDN) is loaded
    // dynamically, like every other page: a static import would silently
    // kill this whole page if that chain fails to load while offline.
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'true') {
            document.getElementById('successMsg').classList.remove('hidden');
        }

        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        const btnText = document.getElementById('loginBtnText');
        const spinner = document.getElementById('loginSpinner');
        const btn = document.getElementById('loginBtn');

        function showError(message) {
            errorBox.innerHTML = '<i class="fas fa-times-circle mt-1 mr-2"></i> <span id="loginErrorText"></span>';
            document.getElementById('loginErrorText').textContent = message;
            errorBox.classList.remove('hidden');
        }

        // LOGIN
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset UI
            errorBox.classList.add('hidden');
            btnText.classList.add('hidden');
            spinner.classList.remove('hidden');
            btn.disabled = true;

            const username = document.getElementById('loginUsername').value.trim();
            const pin = document.getElementById('loginPin').value;

            try {
                if (!username || pin.length !== 4) throw new Error("Check username and PIN.");
                if (!navigator.onLine) throw new Error("You're offline - logging in needs an internet connection. Use \"Continue Offline\" below to keep using the app on this device.");

                const auth = await import('./auth.js');
                await auth.loginUser(username, pin);
                window.location.href = 'dashboard.html';

            } catch (err) {
                showError(err.message || "Couldn't log in. Check your connection and try again.");

                // Limit Check Logic
                if (err.message && (err.message.includes("Limit Reached") || err.message.includes("2 devices"))) {
                    const resetBtn = document.createElement('button');
                    resetBtn.type = "button"; // Important: stop it from submitting the form
                    resetBtn.innerHTML = "Clear Other Devices & Login";
                    resetBtn.className = "mt-2 w-full text-[10px] font-bold text-red-700 underline uppercase block text-left";

                    resetBtn.onclick = async () => {
                        try {
                            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
                            const auth = await import('./auth.js');
                            await auth.clearAllDeviceSessions(username);
                            alert("Sessions Reset! You can now login.");
                            location.reload();
                        } catch (resetErr) {
                            alert("Reset failed. Check internet.");
                            resetBtn.innerHTML = "Clear Other Devices & Login";
                        }
                    };
                    errorBox.appendChild(resetBtn);
                }

                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
                btn.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
